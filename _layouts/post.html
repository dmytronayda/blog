<html>

{% include head.html %}

<body>

    {% include header.html %} 
    
    
<!-- Main -->
<div id="main" class="alt">

{% if page.banner_image %}
<!-- Banner header with a background image, as on the Madeira page -->
<section id="banner" class="style3" style="background-image: url('{{ site.baseurl }}/{{ page.banner_image }}');">
	<div class="inner">
		<header class="major">
			<h1>{{ page.title }}</h1>
		</header>
	</div>
</section>
{% endif %}

<!-- One -->
<section id="one">
	<div class="inner">
		{% unless page.banner_image %}
		<header class="major">
			<h1>{{ page.title }}</h1>
		</header>
		{% endunless %}
		{% if page.image %}<span class="image main"><img src="{{ site.baseurl }}/{{ page.image }}" alt="" /></span>{% endif %}
		<p>{{ content }}</p>
	</div>
</section>

</div>

    <div class="about-lightbox" id="about-lightbox" onclick="closeAboutLightbox()" aria-hidden="true">
        <button type="button" class="about-lightbox-close" aria-label="Close image">&times;</button>
        <img id="about-lightbox-image" src="" alt="" />
    </div>

    {% include footer.html %}

    <script>
        function openLightbox(src) {
            document.getElementById('about-lightbox-image').src = src;
            document.getElementById('about-lightbox').classList.add('active');
            document.getElementById('about-lightbox').setAttribute('aria-hidden', 'false');
        }
        function closeAboutLightbox() {
            document.getElementById('about-lightbox').classList.remove('active');
            document.getElementById('about-lightbox').setAttribute('aria-hidden', 'true');
        }
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') closeAboutLightbox();
        });
    </script>

</body>

</html>
